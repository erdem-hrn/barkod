name: Veriyi güncelle

# Depoya bir Excel (.xlsx) dosyası yüklenince data.json otomatik üretilir.
# Dosya adı önemli değil (büyük/küçük harf dahil); birden fazla Excel varsa
# en son yüklenen kullanılır.
on:
  push:
    paths:
      - "*.[xX][lL][sS][xX]"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: En son yüklenen Excel dosyasını bul
        id: excel
        run: |
          latest=""; latest_t=0
          for f in *.[xX][lL][sS][xX]; do
            [ -e "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -gt "$latest_t" ]; then latest_t=$t; latest="$f"; fi
          done
          if [ -z "$latest" ]; then echo "Depoda .xlsx dosyası bulunamadı."; exit 1; fi
          echo "Kullanılan Excel: $latest"
          echo "file=$latest" >> "$GITHUB_OUTPUT"

      - name: Excel'i data.json'a çevir
        env:
          EXCEL: ${{ steps.excel.outputs.file }}
        run: python convert.py "$EXCEL" data.json

      - name: data.json'u depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Veri güncellendi"
          git push

      - name: Yayını yenile
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "/repos/${{ github.repository }}/pages/builds"
