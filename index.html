<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAKIM MALZEME BİLDİRİM UYGULAMASI</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16211d;--mut:#5b6b64;--line:#d5ddd9;--acc:#128c4a;--accink:#fff;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#101614;--card:#19221e;--ink:#e9f0ed;--mut:#9bada5;--line:#2c3a34;--acc:#25b865;--accink:#06180e;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px;display:grid;gap:14px}
header{display:flex;align-items:center;gap:12px;margin-top:4px}
#logo{width:44px;height:44px;border-radius:8px;flex:none}
h1{font-size:1.1rem;line-height:1.2;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
label{font-size:.9rem;font-weight:700}
input,textarea,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
button.main{background:var(--acc);color:var(--accink);border:0;font-weight:600;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#reader{width:100%;border-radius:10px;overflow:hidden}
#reader:empty{display:none}
#ulist{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px}
#ulist li+li{border-top:1px solid var(--line)}
#ulist button{border:0;border-radius:0;text-align:left;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#vid{width:100%;border-radius:10px;background:#000}
#list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#list button{text-align:left;cursor:pointer;display:grid;gap:2px}
#list b{font-weight:700}
#list span{color:var(--mut);font-size:.9rem}
.hint{color:var(--mut);font-size:.9rem;margin:0}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
dt{font-weight:700}dd{margin:0;overflow-wrap:anywhere}
#msg{color:var(--err);min-height:1.2em;margin:0}
#prev{max-width:100%;border-radius:10px}
#count{color:var(--ink);font-weight:600}
#note{text-transform:uppercase}
#confirm{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--card);color:var(--ink);border-radius:14px;padding:16px;max-width:480px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:12px}
.sheet h2{margin:0;font-size:1.1rem}
#cbody div{overflow-wrap:anywhere}
#cbody .gap{height:12px}
.ask{font-weight:700;margin:0}
[hidden]{display:none!important}
</style>
</head>

    <label for="q">Malzeme No veya Açıklama ile Ara</label>

    <label for="ifs">IFS Bildirim No *</label>
    <input id="ifs" type="text" autocomplete="off">
    <label for="mk">Kullanılacak Makina (Nesne ID) *</label>
    <input id="mk" type="text" autocomplete="off" autocapitalize="characters">
    <label for="user">Malzemeyi Kullanan (Ad Soyad) *</label>
    <input id="user" type="text" autocomplete="off" placeholder="Ara ve listeden seç">
    <ul id="ulist" hidden></ul>
    <label for="note">Ek açıklama</label>

    <label>Parça resmi (isteğe bağlı)</label>

    <input id="photocam" type="file" accept="image/*" capture="environment" hidden>

  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
  s.onerror=function(){var t=document.createElement("script");
    t.src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js";
    document.head.appendChild(t);};
  document.head.appendChild(s);

<script>
const $ = id => document.getElementById(id);
const MAX = 30;
let ITEMS = [], current = null, scanner = null;

// Büyük/küçük harf, Türkçe karakter (ı/i, ç, ş, ğ, ö, ü) farkı gözetmeden arama için
const fold = s => String(s).toLocaleLowerCase("tr").normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").replace(/ı/g, "i");
const say = t => $("msg").textContent = t || "";

fetch("data.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
  ITEMS = Object.entries(d).map(([no, m]) => ({no, ...m, hay: fold(no + " " + m.aciklama)}));
}).catch(() => say("Malzeme listesi yüklenemedi. İnternet bağlantınızı kontrol edin."));

function search(q) {
  const words = fold(q).split(/\s+/).filter(Boolean);
  const fq = fold(q.trim());
  return ITEMS.filter(i => words.every(w => i.hay.includes(w)))
    .sort((a, b) => (fold(b.no) === fq) - (fold(a.no) === fq));
}

function showList(q) {
  const ul = $("list");
  ul.innerHTML = "";
  say("");
  $("count").hidden = true;
  if (q.trim().length < 2) return;
  const res = search(q);
  $("count").textContent = res.length + " adet ürün bulundu";
  $("count").hidden = false;
  if (!res.length) return say("Listede olmayan malzeme için bildirim gönderilemez.");
  res.slice(0, MAX).forEach(it => {
    const li = document.createElement("li"), b = document.createElement("button");
    const no = document.createElement("b"), ac = document.createElement("span");
    no.textContent = it.no; ac.textContent = it.aciklama;
    b.append(no, ac);
    b.onclick = () => select(it);
    li.appendChild(b); ul.appendChild(li);
  });
  if (res.length > MAX) {
    const p = document.createElement("li");
    p.className = "hint";
    p.textContent = "İlk " + MAX + " tanesi gösteriliyor. Aramayı daraltın.";
    ul.appendChild(p);
  }
  return res;
}

function select(it) {
  current = it;
  $("list").innerHTML = "";
  $("count").hidden = true;
  $("r-no").textContent = it.no;
  $("r-ac").textContent = it.aciklama;
  $("r-mk").textContent = it.miktar;
  $("r-lk").textContent = it.lokasyon;
  $("result").hidden = false;
  $("result").scrollIntoView({behavior: "smooth", block: "start"});
}

$("q").oninput = e => {
  current = null; $("result").hidden = true;   // yeni arama: eski seçimi temizle
  showList(e.target.value);
};

let stream = null, loop = null;

async function stopScan() {
  if (loop) { clearInterval(loop); loop = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $("vid").hidden = true; $("vid").srcObject = null;
  if (scanner) { try { await scanner.stop(); scanner.clear(); } catch (e) {} scanner = null; }
  $("scan").textContent = "Barkod okut";
}

function found(text) {
  stopScan();
  $("q").value = text;
  const res = showList(text);
  if (res && res.length === 1) select(res[0]);
}

async function startNative() {
  const det = new BarcodeDetector();
  stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}}});
  const v = $("vid");
  v.srcObject = stream; v.hidden = false;
  await v.play();
  loop = setInterval(async () => {
    try {
      const r = await det.detect(v);
      if (loop && r.length) found(r[0].rawValue);
    } catch (e) {}
  }, 250);
}

function errText(e) {
  const m = String((e && (e.name + " " + e.message)) || e);
  if (/NotAllowed|Permission/i.test(m)) return "Kamera izni verilmedi. Chrome'da adres çubuğundaki simgeden bu site için kamerayı etkinleştirin.";
  if (/NotFound|Overconstrained/i.test(m)) return "Kamera bulunamadı.";
  if (/NotReadable|Abort/i.test(m)) return "Kamera başka bir uygulama tarafından kullanılıyor olabilir. Diğer uygulamaları kapatıp tekrar deneyin.";
  return "Kamera açılamadı: " + m;
}

$("scan").onclick = async () => {
  if (stream || scanner) return stopScan();
  if (!window.isSecureContext) return say("Kamera için sayfa https:// adresiyle açılmalı.");
  $("scan").textContent = "Kamerayı kapat";
  say("Kamera başlatılıyor…");
  try {
    if ("BarcodeDetector" in window) {
      await startNative();
    } else {
      if (!window.Html5Qrcode) throw new Error("Tarama bileşeni yüklenemedi.");
      scanner = new Html5Qrcode("reader");
      await scanner.start({facingMode: "environment"}, {fps: 10, qrbox: {width: 260, height: 160}}, found);
    }
    say("");
  } catch (e) {
    await stopScan();
    say(errText(e));
  }
};

// Canlı kamera çalışmazsa: telefonun kendi kamerasıyla fotoğraf çekip barkodu okur
$("shotbtn").onclick = () => $("shot").click();
$("shot").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  say("Barkod okunuyor…");
  try {
    let text = "";
    if ("BarcodeDetector" in window) {
      const r = await new BarcodeDetector().detect(await createImageBitmap(f));
      text = r.length ? r[0].rawValue : "";
    } else if (window.Html5Qrcode) {
      text = await new Html5Qrcode("reader").scanFile(f, false);
    }
    if (!text) return say("Barkod okunamadı. Barkodu yakından ve net çekip tekrar deneyin.");
    say("");
    found(text);
  } catch (err) {
    say("Barkod okunamadı. Barkodu yakından ve net çekip tekrar deneyin.");
  }
};

let photoFile = null;
function setPhoto(f) {
  photoFile = f || null;
  $("prev").hidden = $("clear").hidden = !photoFile;
  if (photoFile) $("prev").src = URL.createObjectURL(photoFile);
}
$("pick").onclick = () => $("photo").click();
$("snap").onclick = () => $("photocam").click();
$("clear").onclick = () => setPhoto(null);
["photo", "photocam"].forEach(id => $(id).onchange = e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f) setPhoto(f);
});

let USERS = [];
fetch("kisiler.txt", {cache: "no-cache"}).then(r => r.ok ? r.text() : "").then(t => {
  USERS = [...new Set(t.replace(/^\uFEFF/, "").split(/\r?\n/).map(x => x.trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "tr"));
}).catch(() => {});

function showUsers() {
  const ul = $("ulist"), val = $("user").value.trim();
  const words = fold(val).split(/\s+/).filter(Boolean);
  const res = USERS.filter(n => { const f = fold(n); return words.every(w => f.includes(w)); });
  ul.innerHTML = "";
  res.forEach(n => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button"; b.textContent = n;
    b.onclick = () => { $("user").value = n; ul.hidden = true; };
    li.appendChild(b); ul.appendChild(li);
  });
  ul.hidden = !res.length || (res.length === 1 && res[0] === val);
}
$("user").onfocus = $("user").oninput = showUsers;
document.addEventListener("click", e => {
  if (e.target !== $("user") && !$("ulist").contains(e.target)) $("ulist").hidden = true;
});

$("mk").oninput = e => {
  const el = e.target, pos = el.selectionStart;
  el.value = el.value.toUpperCase();
  el.setSelectionRange(pos, pos);
};

const icon = document.createElement("link");
icon.rel = "icon"; icon.href = $("logo").src;
document.head.appendChild(icon);

let pending = null;

function resetForm() {
  current = null; pending = null;
  stopScan();
  ["q", "qty", "ifs", "mk", "user", "note"].forEach(id => $(id).value = "");
  $("list").innerHTML = ""; $("ulist").innerHTML = ""; $("ulist").hidden = true;
  $("count").hidden = true; $("result").hidden = true; $("confirm").hidden = true;
  setPhoto(null);
  say("");
  window.scrollTo({top: 0, behavior: "smooth"});
}
$("resetall").onclick = resetForm;

$("send").onclick = () => {
  if (!current) return say("Listede olmayan malzeme için bildirim gönderilemez. Listeden bir malzeme seçin.");
  const need = (ad, id) => { say(ad + " alanı zorunludur."); $(id).focus(); };
  const qty = $("qty").value.trim();
  const ifs = $("ifs").value.trim(), mk = $("mk").value.trim().toUpperCase();
  const val = $("user").value.trim();
  const user = USERS.find(n => fold(n) === fold(val));   // yalnızca listedeki isimler kabul edilir
  const note = $("note").value.trim().toLocaleUpperCase("tr");
  if (!(Number(qty) > 0)) return need("Çekilen Miktar", "qty");
  if (!ifs) return need("IFS Bildirim No", "ifs");
  if (!mk) return need("Kullanılacak Makina", "mk");
  if (!USERS.length) return say("Kişi listesi yüklenemedi. Sayfayı yenileyip tekrar deneyin.");
  if (!user) { say("Malzemeyi Kullanan için listeden bir isim seçin."); $("user").focus(); showUsers(); return; }
  say("");

  const rows = [
    ["Malzeme No", current.no],
    ["Açıklama", current.aciklama],
    ["Depodaki Miktar", current.miktar],
    ["Lokasyon No", current.lokasyon],
    null,
    ["Çekilen Miktar", qty],
    ["IFS Bildirim No", ifs],
    ["Kullanılacak Makina (Nesne ID)", mk],
    ["Malzemeyi Kullanan", user]
  ];
  if (note) rows.push(["Ek Açıklama", note]);

  const body = $("cbody");
  body.innerHTML = "";
  rows.forEach(r => {
    const d = document.createElement("div");
    if (r) { const b = document.createElement("b"); b.textContent = r[0] + ":"; d.append(b, " " + r[1]); }
    else d.className = "gap";
    body.appendChild(d);
  });
  if (photoFile) {
    const d = document.createElement("div");
    d.className = "hint"; d.textContent = "Parça resmi mesajla birlikte gönderilecek.";
    body.appendChild(d);
  }
  pending = {text: rows.map(r => r ? "*" + r[0] + ":* " + r[1] : "").join("\n"), file: photoFile};
  $("confirm").hidden = false;
};

$("no").onclick = () => { $("confirm").hidden = true; pending = null; };

$("yes").onclick = async () => {
  if (!pending) return;
  const {text, file} = pending;
  $("confirm").hidden = true; pending = null;
  let warn = "";
  try {
    if (file && navigator.canShare && navigator.canShare({files: [file]})) {
      await navigator.share({text, files: [file]});
    } else if (navigator.share && !file) {
      await navigator.share({text});
    } else {
      if (file) warn = "Bu cihaz resimli paylaşımı desteklemiyor, yalnızca metin gönderildi.";
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    }
    resetForm();
    if (warn) say(warn);
  } catch (e) {
    if (e.name !== "AbortError") say("Paylaşım açılamadı.");
  }
};
</script>
</body>
</html>
